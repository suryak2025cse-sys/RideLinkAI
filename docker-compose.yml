version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ridelink_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai_service:
    build: ./ai_service
    container_name: ridelink_ai_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  server:
    build: ./server
    container_name: ridelink_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ridelink_ai
      - JWT_SECRET=ridelink_super_secret_jwt_key_2026
      - PYTHON_AI_URL=http://ai_service:5001
    depends_on:
      - mongodb
      - ai_service

  client:
    build: ./client
    container_name: ridelink_client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
